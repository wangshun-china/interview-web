name: Deploy Portfolio (resume site)

# Fires only when the site itself changes. Gateway config changes are picked
# up by deploy-gateway.yml; the TLS edge is never recreated by this workflow.
on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - "deploy/Dockerfile.portfolio"
      - "deploy/portfolio.nginx.conf"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:
    inputs:
      target_env:
        description: '请选择要部署的目标服务器 (默认推送到阿里云)'
        required: true
        default: 'aliyun'
        type: choice
        options:
          - aliyun
          - wsl

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ALIYUN_ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
  ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
  INTERVIEW_IMAGE_NAME: ${{ vars.INTERVIEW_IMAGE_NAME }}
  GATEWAY_IMAGE_NAME: ${{ vars.INTERVIEW_GATEWAY_IMAGE_NAME }}

jobs:
  build:
    name: Build Portfolio Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build Frontend
        run: |
          pnpm install
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ALIYUN_ACR_USERNAME }}
          password: ${{ env.ALIYUN_ACR_PASSWORD }}

      - name: Build and push Portfolio
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.portfolio
          push: true
          provenance: false
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:latest
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.INTERVIEW_IMAGE_NAME }}:latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.INTERVIEW_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,scope=portfolio,mode=max

  deploy:
    # DEPLOY_V2_ENABLED doubles as a kill switch for unattended deploys.
    if: >-
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      && vars.DEPLOY_V2_ENABLED == 'true'
    name: Deploy Portfolio to ${{ github.event.inputs.target_env || 'aliyun' }}
    needs: build
    runs-on: [self-hosted, "${{ github.event.inputs.target_env || 'aliyun' }}"]
    concurrency:
      group: wangshun-gateway-${{ github.event.inputs.target_env || 'aliyun' }}
      cancel-in-progress: false
    steps:
      - name: Checkout (with retry, self-hosted)
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          for attempt in 1 2 3 4 5; do
            if [ ! -d .git ]; then
              find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              git init -q .
              git remote add origin "$REPO_URL"
            fi
            if git -c http.version=HTTP/1.1 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=45 \
                 fetch -q --depth 1 origin "$SHA" \
               && git checkout -q --force "$SHA" \
               && git clean -ffdxq; then
              echo "Checked out $SHA on attempt $attempt"
              exit 0
            fi
            echo "Fetch attempt $attempt failed; resetting workspace copy and retrying"
            rm -rf .git
            sleep $((attempt * 10))
          done
          echo "Unable to fetch $SHA from GitHub after 5 attempts" >&2
          exit 1

      - name: Deploy
        env:
          GATEWAY_DEPLOY_DIR: /opt/wangshun-portfolio
          GHCR_REGISTRY: ${{ env.GHCR_REGISTRY }}
          GHCR_IMAGE_NAME: ${{ env.GHCR_IMAGE_NAME }}
          ALIYUN_ACR_REGISTRY: ${{ env.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ env.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ env.ALIYUN_ACR_PASSWORD }}
          INTERVIEW_IMAGE_NAME: ${{ env.INTERVIEW_IMAGE_NAME }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          OPS_INITIAL_PASSWORD: ${{ secrets.OPS_INITIAL_PASSWORD }}
          OPS_AGENT_TOKEN: ${{ secrets.OPS_AGENT_TOKEN }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "${{ github.token }}" |
            docker login "$GHCR_REGISTRY" -u "${{ github.actor }}" --password-stdin
          printf '%s' "$ALIYUN_ACR_PASSWORD" |
            docker login "$ALIYUN_ACR_REGISTRY" -u "$ALIYUN_ACR_USERNAME" --password-stdin

          GHCR_IMAGE="${GHCR_REGISTRY}/${GHCR_IMAGE_NAME}:${GITHUB_SHA}"
          ACR_IMAGE="${ALIYUN_ACR_REGISTRY}/${INTERVIEW_IMAGE_NAME}:${GITHUB_SHA}"
          if timeout 120 docker pull "$GHCR_IMAGE"; then
            PORTFOLIO_IMAGE="$GHCR_IMAGE"
          elif timeout 120 docker pull "$ACR_IMAGE"; then
            echo "GHCR pull failed or timed out; using Aliyun ACR (faster from this host)."
            PORTFOLIO_IMAGE="$ACR_IMAGE"
          else
            echo "Unable to pull the portfolio image from GHCR or Aliyun ACR." >&2
            exit 1
          fi

          export DEPLOY_PORTFOLIO_IMAGE="$PORTFOLIO_IMAGE"
          export DEPLOY_SERVICE="portfolio"
          export PORTFOLIO_LATEST="${ALIYUN_ACR_REGISTRY}/${INTERVIEW_IMAGE_NAME}:latest"
          export GATEWAY_LATEST="${ALIYUN_ACR_REGISTRY}/${GATEWAY_IMAGE_NAME}:latest"
          bash deploy/deploy-gateway.sh
          docker image prune -f
