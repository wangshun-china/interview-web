name: Build and Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_env:
        description: '请选择要部署的目标服务器 (默认推送到阿里云)'
        required: true
        default: 'aliyun'
        type: choice
        options:
          - aliyun
          - wsl

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ALIYUN_ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
  ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
  INTERVIEW_IMAGE_NAME: ${{ vars.INTERVIEW_IMAGE_NAME }}

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build Frontend
        run: |
          pnpm install
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ALIYUN_ACR_USERNAME }}
          password: ${{ env.ALIYUN_ACR_PASSWORD }}

      - name: Build and push Application
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:latest
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.INTERVIEW_IMAGE_NAME }}:latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.INTERVIEW_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ github.event.inputs.target_env || 'aliyun' }}
    needs: build
    runs-on: [self-hosted, "${{ github.event.inputs.target_env || 'aliyun' }}"]
    concurrency:
      group: wangshun-gateway-${{ github.event.inputs.target_env || 'aliyun' }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          GATEWAY_DEPLOY_DIR: /opt/wangshun-portfolio
          GHCR_REGISTRY: ${{ env.GHCR_REGISTRY }}
          GHCR_IMAGE_NAME: ${{ env.GHCR_IMAGE_NAME }}
          ALIYUN_ACR_REGISTRY: ${{ env.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ env.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ env.ALIYUN_ACR_PASSWORD }}
          INTERVIEW_IMAGE_NAME: ${{ env.INTERVIEW_IMAGE_NAME }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          OPS_INITIAL_PASSWORD: ${{ secrets.OPS_INITIAL_PASSWORD }}
          OPS_AGENT_TOKEN: ${{ secrets.OPS_AGENT_TOKEN }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "${{ github.token }}" |
            docker login "$GHCR_REGISTRY" -u "${{ github.actor }}" --password-stdin
          printf '%s' "$ALIYUN_ACR_PASSWORD" |
            docker login "$ALIYUN_ACR_REGISTRY" -u "$ALIYUN_ACR_USERNAME" --password-stdin

          GHCR_IMAGE="${GHCR_REGISTRY}/${GHCR_IMAGE_NAME}:${GITHUB_SHA}"
          ACR_IMAGE="${ALIYUN_ACR_REGISTRY}/${INTERVIEW_IMAGE_NAME}:${GITHUB_SHA}"
          if docker pull "$GHCR_IMAGE"; then
            DEPLOY_IMAGE="$GHCR_IMAGE"
          elif docker pull "$ACR_IMAGE"; then
            echo "GHCR pull failed; using Aliyun ACR fallback."
            DEPLOY_IMAGE="$ACR_IMAGE"
          else
            echo "Unable to pull the release image from GHCR or Aliyun ACR." >&2
            exit 1
          fi

          export DEPLOY_IMAGE
          bash deploy/deploy-gateway.sh
          docker image prune -f

  deploy-wsl-agent:
    name: Deploy WSL Ops Agent
    needs: deploy
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and restart agent
        env:
          OPS_AGENT_TOKEN: ${{ secrets.OPS_AGENT_TOKEN }}
        run: |
          printf '%s\n' "$OPS_AGENT_TOKEN" |
            sudo -n /usr/bin/bash ops-agent/install.sh
