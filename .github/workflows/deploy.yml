name: Build and Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_env:
        description: '请选择要部署的目标服务器 (默认推送到阿里云)'
        required: true
        default: 'aliyun'
        type: choice
        options:
          - aliyun
          - wsl

env:
  ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ALIYUN_ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
  ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
  INTERVIEW_IMAGE_NAME: ${{ vars.INTERVIEW_IMAGE_NAME }}

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        run: |
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ALIYUN_ACR_USERNAME }}
          password: ${{ env.ALIYUN_ACR_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.INTERVIEW_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ github.event.inputs.target_env || 'aliyun' }}
    needs: build
    runs-on: [self-hosted, "${{ github.event.inputs.target_env || 'aliyun' }}"]
    steps:
      - name: Deploy
        env:
          ALIYUN_ACR_REGISTRY: ${{ env.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ env.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ env.ALIYUN_ACR_PASSWORD }}
          INTERVIEW_IMAGE_NAME: ${{ env.INTERVIEW_IMAGE_NAME }}
        run: |
          mkdir -p wangshun-portfolio
          cd wangshun-portfolio

          cat > docker-compose.yml << EOF
          services:
            portfolio:
              image: ${ALIYUN_ACR_REGISTRY}/${INTERVIEW_IMAGE_NAME}:latest
              container_name: wangshun-portfolio
              restart: unless-stopped
              ports:
                - "80:80"
          EOF

          echo "${ALIYUN_ACR_PASSWORD}" | docker login "${ALIYUN_ACR_REGISTRY}" -u "${ALIYUN_ACR_USERNAME}" --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
