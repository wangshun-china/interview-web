name: Build and Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_env:
        description: '请选择要部署的目标服务器 (默认推送到阿里云)'
        required: true
        default: 'aliyun'
        type: choice
        options:
          - aliyun
          - wsl

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ALIYUN_ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
  ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
  INTERVIEW_IMAGE_NAME: ${{ vars.INTERVIEW_IMAGE_NAME }}

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        run: |
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ALIYUN_ACR_USERNAME }}
          password: ${{ env.ALIYUN_ACR_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:latest
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.INTERVIEW_IMAGE_NAME }}:latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.INTERVIEW_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ github.event.inputs.target_env || 'aliyun' }}
    needs: build
    runs-on: [self-hosted, "${{ github.event.inputs.target_env || 'aliyun' }}"]
    steps:
      - name: Deploy
        env:
          GHCR_REGISTRY: ${{ env.GHCR_REGISTRY }}
          GHCR_IMAGE_NAME: ${{ env.GHCR_IMAGE_NAME }}
          ALIYUN_ACR_REGISTRY: ${{ env.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ env.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ env.ALIYUN_ACR_PASSWORD }}
          INTERVIEW_IMAGE_NAME: ${{ env.INTERVIEW_IMAGE_NAME }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "${{ github.token }}" |
            docker login "$GHCR_REGISTRY" -u "${{ github.actor }}" --password-stdin
          printf '%s' "$ALIYUN_ACR_PASSWORD" |
            docker login "$ALIYUN_ACR_REGISTRY" -u "$ALIYUN_ACR_USERNAME" --password-stdin

          GHCR_IMAGE="${GHCR_REGISTRY}/${GHCR_IMAGE_NAME}:${GITHUB_SHA}"
          ACR_IMAGE="${ALIYUN_ACR_REGISTRY}/${INTERVIEW_IMAGE_NAME}:${GITHUB_SHA}"
          if docker pull "$GHCR_IMAGE"; then
            DEPLOY_IMAGE="$GHCR_IMAGE"
          elif docker pull "$ACR_IMAGE"; then
            echo "GHCR pull failed; using Aliyun ACR fallback."
            DEPLOY_IMAGE="$ACR_IMAGE"
          else
            echo "Unable to pull the release image from GHCR or Aliyun ACR." >&2
            exit 1
          fi

          mkdir -p wangshun-portfolio
          cd wangshun-portfolio

          cat > docker-compose.yml << EOF
          services:
            portfolio:
              image: ${DEPLOY_IMAGE}
              container_name: wangshun-portfolio
              restart: unless-stopped
              ports:
                - "80:80"
              extra_hosts:
                - "host.docker.internal:host-gateway"
              volumes:
                - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
          EOF

          cat > nginx.conf << 'NGINX'
          server {
              listen 80;
              server_name wangshun.work www.wangshun.work;

              location / {
                  root /usr/share/nginx/html;
                  index index.html index.htm;
                  try_files $uri $uri/ /index.html;
              }
          }

          server {
              listen 80;
              server_name ai-coder.wangshun.work;

              location / {
                  proxy_pass http://host.docker.internal:8888;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }

          server {
              listen 80;
              server_name api_transfer.wangshun.work;

              location / {
                  proxy_pass http://host.docker.internal:7777;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

          server {
              listen 80;
              server_name rpc.wangshun.work;

              location / {
                  proxy_pass http://host.docker.internal:3000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

          server {
              listen 80;
              server_name api.wangshun.work;

              client_max_body_size 10m;

              location / {
                  proxy_pass http://host.docker.internal:18080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_read_timeout 120s;
                  proxy_send_timeout 120s;
              }
          }
          NGINX

          docker compose up -d --remove-orphans --pull never
          docker image prune -f
