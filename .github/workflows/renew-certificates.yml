name: Renew HTTPS Certificates

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wangshun-gateway-aliyun
  cancel-in-progress: false

jobs:
  renew:
    name: Renew certificates on Aliyun
    runs-on: [self-hosted, aliyun]
    env:
      GATEWAY_DEPLOY_DIR: /opt/wangshun-portfolio
      CERTBOT_IMAGE: certbot/certbot:v5.7.0
    steps:
      - name: Renew certificates and reload nginx
        env:
          OPS_AGENT_TOKEN: ${{ secrets.OPS_AGENT_TOKEN }}
        shell: bash
        # No actions/checkout on purpose: this runner frequently cannot reach
        # github.com, and renewal only needs state that already lives on this
        # host (/opt/wangshun-portfolio + the local certbot image).
        run: |
          set -Eeuo pipefail

          DEPLOY_DIR="${GATEWAY_DEPLOY_DIR:?GATEWAY_DEPLOY_DIR is required}"
          CERT_PATH="$DEPLOY_DIR/certbot/conf/live/wangshun.work/fullchain.pem"
          : "${OPS_AGENT_TOKEN:?OPS_AGENT_TOKEN is required}"

          report_job() {
            curl -fsS --max-time 10 \
              -H "Content-Type: application/json" \
              -H "X-Ops-Agent-Token: $OPS_AGENT_TOKEN" \
              --data "{\"name\":\"certificate-renewal\",\"status\":\"$1\",\"message\":\"$2\"}" \
              https://ops.wangshun.work/api/ops/agent/jobs >/dev/null || true
          }
          trap 'report_job failed "renewal script failed at line $LINENO"' ERR

          [[ -f "$CERT_PATH" ]] || {
            report_job failed "certificate missing: $CERT_PATH"
            exit 1
          }

          if ! docker image inspect "$CERTBOT_IMAGE" >/dev/null 2>&1; then
            docker pull "$CERTBOT_IMAGE" || true
            docker image inspect "$CERTBOT_IMAGE" >/dev/null 2>&1 \
              || CERTBOT_IMAGE="certbot/certbot:latest"
          fi
          docker image inspect "$CERTBOT_IMAGE" >/dev/null 2>&1 || {
            report_job failed "no certbot image available locally or via pull"
            exit 1
          }

          docker run --rm \
            -v "$DEPLOY_DIR/certbot/conf:/etc/letsencrypt" \
            -v "$DEPLOY_DIR/certbot/lib:/var/lib/letsencrypt" \
            -v "$DEPLOY_DIR/certbot/log:/var/log/letsencrypt" \
            -v "$DEPLOY_DIR/certbot/www:/var/www/certbot" \
            "$CERTBOT_IMAGE" renew \
              --non-interactive \
              --webroot \
              --webroot-path /var/www/certbot

          docker exec wangshun-portfolio nginx -t
          docker exec wangshun-portfolio nginx -s reload
          sleep 1

          # Validate the certificate chain end to end: the gateway must serve
          # the on-disk cert over 443 and the site must answer. App-level
          # services are NOT this job's business; they have their own checks.
          served_expiry=$(echo | openssl s_client -connect 127.0.0.1:443 \
            -servername wangshun.work 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          [[ -n "$served_expiry" ]] || {
            report_job failed "gateway did not serve a certificate on 443"
            exit 1
          }
          curl -fsS --max-time 10 --noproxy '*' \
            --resolve "wangshun.work:443:127.0.0.1" \
            https://wangshun.work/ -o /dev/null

          days_left=$(( ( $(date -d "$served_expiry" +%s) - $(date +%s) ) / 86400 ))
          if (( days_left < 15 )); then
            report_job failed "certificate expires in ${days_left} days and renewals keep failing"
            echo "Certificate only has ${days_left} days left; renewal window has been open but not succeeding." >&2
            exit 1
          fi

          report_job success "certificate ok, ${days_left} days remaining (renewed or not yet due)"
