services:
  # Edge: TLS termination + domain routing + ops backend. The only container
  # with host ports; recreating it briefly interrupts every domain.
  gateway:
    image: ${GATEWAY_IMAGE:?set GATEWAY_IMAGE}
    container_name: wangshun-gateway
    labels:
      wangshun.ops.protected: "true"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPS_HOST: 127.0.0.1
      OPS_PORT: 8787
      OPS_DATA_DIR: /data
      OPS_ROUTE_DIR: /etc/nginx/routes
      OPS_NGINX_ACCESS_LOG: /var/log/nginx/access-json.log
      OPS_NGINX_CONFIG: /etc/nginx/conf.d/default.conf
      OPS_DOCKER_SOCKET: /var/run/docker.sock
      OPS_APPLY_ROUTES: "true"
      OPS_COOKIE_SECURE: "true"
      OPS_INITIAL_USERNAME: admin
      OPS_INITIAL_PASSWORD: ${OPS_INITIAL_PASSWORD:?set OPS_INITIAL_PASSWORD}
      OPS_AGENT_TOKEN: ${OPS_AGENT_TOKEN:?set OPS_AGENT_TOKEN}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./ops-data:/data
      - ./routes:/etc/nginx/routes
      - ./nginx-logs:/var/log/nginx
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - portfolio

  # Site: static resume + ops panel frontend. No host ports; reached only
  # through the gateway, so portfolio deploys never touch the TLS edge.
  portfolio:
    image: ${PORTFOLIO_IMAGE:?set PORTFOLIO_IMAGE}
    container_name: wangshun-portfolio
    labels:
      wangshun.ops.protected: "true"
    restart: unless-stopped
    expose:
      - "80"
