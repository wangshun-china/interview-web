user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Docker embedded DNS. Container-name upstreams (portfolio, agent-quest)
    # are referenced through variables in proxy_pass so every request
    # re-resolves: a recreated container with a new IP heals itself without
    # an nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
