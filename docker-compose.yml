services:
  portfolio:
    image: ${ALIYUN_ACR_REGISTRY:?set ALIYUN_ACR_REGISTRY}/${INTERVIEW_IMAGE_NAME:-wangshun_build/wangshun_portfolio}:latest
    container_name: wangshun-portfolio
    restart: always
    ports:
      - "80:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
