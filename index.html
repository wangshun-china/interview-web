<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>王顺 | AI Agent 应用开发实习生</title>
    <meta name="description" content="王顺的个人简历 - AI Agent 应用开发 | AI Code Review | 工程化部署">
    <script>
      // Apply the theme before first paint to avoid a light/dark flash.
      // Must stay in sync with App.vue's three-state logic.
      (function () {
        try {
          var mode = localStorage.getItem('wangshun-theme') || 'system'
          var dark = mode === 'dark' ||
            (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
